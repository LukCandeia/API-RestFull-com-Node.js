<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerenciamento de Produtos</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Gerenciamento de Produtos</h1>
        <p>Aplicação Web CRUD de Produtos consumindo API REST</p>
      </header>
      <main>

        <section class="card">
          <h2 id="form-title">Cadastrar Novo Produto</h2>
          <form id="product-form">
            <input type="hidden" id="product-id" />

            <div class="form-group">
              <label for="descricao">Descrição</label>
              <input
                type="text"
                id="descricao"
                placeholder="Ex: Monitor 24 Polegadas"
                required
              />
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="preco">Preço (R$)</label>
                <input
                  type="number"
                  id="preco"
                  step="0.01"
                  min="0"
                  placeholder="0.00"
                  required
                />
              </div>

              <div class="form-group">
                <label for="categoria">Categoria</label>
                <input
                  type="text"
                  id="categoria"
                  placeholder="Ex: Periféricos"
                  required
                />
              </div>

              <div class="form-group">
                <label for="estoque">Estoque</label>
                <input
                  type="number"
                  id="estoque"
                  min="0"
                  placeholder="0"
                  required
                />
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" id="btn-save" class="btn btn-primary">
                Salvar Produto
              </button>
              <button
                type="button"
                id="btn-cancel"
                class="btn btn-secondary"
                style="display: none"
              >
                Cancelar Edição
              </button>
            </div>
          </form>
        </section>

        <section class="card">
          <h2>Lista de Produtos</h2>
          <div class="table-container">
            <table id="products-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Descrição</th>
                  <th>Preço</th>
                  <th>Categoria</th>
                  <th>Estoque</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="products-body">
                // Renderização dinâmica via JS
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
